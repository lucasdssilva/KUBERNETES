apiVersion: v1
kind: PersistentVolume

metadata:
  name: jenkins-pv

spec:
  capacity:
    storage: 10Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  hostPath:
    path: /data/jenkins

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: jenkins-pvc
  namespace: devops

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 10Gi